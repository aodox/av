version: '3.8'

services:
  tencent-live:
    build: .
    container_name: tencent-live
    ports:
      - "8080:8080"
    environment:
      - TENCENT_SECRET_ID=${TENCENT_SECRET_ID}
      - TENCENT_SECRET_KEY=${TENCENT_SECRET_KEY}
      - TENCENT_AUTH_KEY=${TENCENT_AUTH_KEY}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    depends_on:
      - mysql
      - redis
    networks:
      - tencent-live-net
    restart: unless-stopped

  mysql:
    image: mysql:5.7
    container_name: tencent-live-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=tencent_live
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tencent-live-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tencent-live-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tencent-live-net
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

networks:
  tencent-live-net:
    driver: bridge
